name: Scrubber missed a secret shape
description: A kind of secret or personal data that was not masked (use a FAKE example)
labels: [scrubber, security]
body:
  - type: markdown
    attributes:
      value: "Use an obviously fake value with the same shape. For a real leak of a live credential, rotate it first and do not post it here."
  - type: input
    id: kind
    attributes: {label: "Kind of secret", placeholder: "Vendor X API key"}
    validations: {required: true}
  - type: textarea
    id: shape
    attributes: {label: "Fake example with the same shape, and the surrounding text"}
    validations: {required: true}
