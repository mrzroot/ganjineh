[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ganjineh"
dynamic = ["version"]
description = "A shared notebook for your team's AI coding helpers (Claude Code, Codex, Cursor, Gemini CLI, Copilot): they write and read it by themselves, in a git repo you own. No server, no account, no extra AI calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["ai-agents", "claude-code", "codex", "mcp", "team-memory", "shared-memory", "git", "persian", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",
  "Programming Language :: Python :: 3", "Natural Language :: Persian", "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://mrzroot.github.io/ganjineh/"
Source = "https://github.com/mrzroot/ganjineh"
Issues = "https://github.com/mrzroot/ganjineh/issues"

[project.scripts]
ganjineh = "ganjineh.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ganjineh.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
