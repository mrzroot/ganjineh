[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gonjineh"
dynamic = ["version"]
description = "Git-native shared memory for your team's AI coding agents (Claude Code, Codex, Cursor, Gemini CLI, Copilot): LLM-free session digests, secret scrubbing, local search, MCP server. No server, no account."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["ai-agents", "claude-code", "codex", "mcp", "team-memory", "shared-memory", "git", "persian", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",
  "Programming Language :: Python :: 3", "Natural Language :: Persian", "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://mrzroot.github.io/gonjineh/"
Source = "https://github.com/mrzroot/gonjineh"
Issues = "https://github.com/mrzroot/gonjineh/issues"

[project.scripts]
gonjineh = "gonjineh.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gonjineh.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
